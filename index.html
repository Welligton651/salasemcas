<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam DVR Dashboard</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos personalizados para o feed de vídeo */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            font-family: 'Inter', sans-serif;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .recording-indicator {
            display: none;
            position: absolute;
            top: 1rem;
            right: 1rem;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: bold;
            color: #ef4444; /* Red 500 */
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-video"></i> WebDVR Live Monitor
            </h1>
            <div class="text-sm text-slate-400 flex items-center gap-2">
                <span id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500"></span>
                <span id="statusText">Câmera Desconectada</span>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col items-center justify-center gap-6">
        
        <div class="video-container">
            <!-- Vídeo onde a webcam será exibida -->
            <video id="webcamVideo" autoplay playsinline muted></video>
            
            <!-- Indicador visual de gravação (Bolinha vermelha piscando) -->
            <div id="recordingIndicator" class="recording-indicator">
                <span class="w-3 h-3 rounded-full bg-red-500"></span>
                REC
            </div>

            <!-- Overlay quando a câmera está desligada -->
            <div id="videoOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 text-slate-400">
                <i class="fa-solid fa-camera-slash text-4xl mb-2"></i>
                <p>Câmera inativa</p>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-4 justify-center shadow-lg w-full max-w-3xl">
            
            <!-- Controles de Câmera -->
            <button id="btnStartCamera" class="flex-1 min-w-[140px] bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-power-off"></i> Ligar Câmera
            </button>
            <button id="btnStopCamera" class="flex-1 min-w-[140px] bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 hidden">
                <i class="fa-solid fa-stop"></i> Desligar Câmera
            </button>

            <!-- Controles de Gravação -->
            <button id="btnStartRecord" disabled class="flex-1 min-w-[140px] bg-red-600 hover:bg-red-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle text-xs"></i> Gravar
            </button>
            <button id="btnStopRecord" class="flex-1 min-w-[140px] bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 hidden">
                <i class="fa-solid fa-square text-xs"></i> Parar Gravação
            </button>
            
            <!-- Controle Picture-in-Picture (Janela Flutuante) -->
            <button id="btnPip" disabled class="flex-1 min-w-[140px] bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-clone"></i> Janela Flutuante
            </button>
        </div>

        <!-- Área onde os vídeos gravados aparecerão -->
        <div id="galleryContainer" class="w-full max-w-3xl hidden">
            <h2 class="text-xl font-bold mb-4 border-b border-slate-700 pb-2">Gravações Recentes</h2>
            <div id="recordingsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Links de download serão injetados aqui via JS -->
            </div>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-sm text-slate-500">
        Desenvolvido para monitoramento local. Para gravação com tela bloqueada, utilize um software nativo (OS).
    </footer>

    <script>
        // Referências aos elementos do DOM
        const videoElement = document.getElementById('webcamVideo');
        const videoOverlay = document.getElementById('videoOverlay');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnStopCamera = document.getElementById('btnStopCamera');
        const btnStartRecord = document.getElementById('btnStartRecord');
        const btnStopRecord = document.getElementById('btnStopRecord');
        const btnPip = document.getElementById('btnPip');
        
        const galleryContainer = document.getElementById('galleryContainer');
        const recordingsList = document.getElementById('recordingsList');

        // Variáveis globais para gerenciar o stream e a gravação
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        async function startCamera() {
            try {
                // Solicita acesso à câmera e ao microfone
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                });
                
                // Conecta o stream de mídia ao elemento de vídeo
                videoElement.srcObject = mediaStream;
                videoOverlay.style.display = 'none';
                
                // Atualiza UI
                btnStartCamera.classList.add('hidden');
                btnStopCamera.classList.remove('hidden');
                btnStartRecord.disabled = false;
                
                // Habilita PiP se suportado
                if (document.pictureInPictureEnabled) {
                    btnPip.disabled = false;
                }

                statusIndicator.classList.replace('bg-red-500', 'bg-green-500');
                statusText.textContent = 'Câmera Ativa';

            } catch (error) {
                console.error("Erro ao acessar a webcam: ", error);
                alert("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                // Para todas as faixas (tracks) do stream
                mediaStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
                
                // Atualiza UI
                videoOverlay.style.display = 'flex';
                btnStartCamera.classList.remove('hidden');
                btnStopCamera.classList.add('hidden');
                btnStartRecord.disabled = true;
                btnPip.disabled = true;
                
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    stopRecording();
                }

                statusIndicator.classList.replace('bg-green-500', 'bg-red-500');
                statusText.textContent = 'Câmera Desconectada';
            }
        }

        function startRecording() {
            if (!mediaStream) return;

            recordedChunks = [];
            // Utiliza o MediaRecorder para capturar o stream
            // Preferência por webm (padrão em navegadores)
            try {
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm; codecs=vp9' });
            } catch (e) {
                // Fallback caso vp9 não seja suportado
                mediaRecorder = new MediaRecorder(mediaStream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = saveRecording;
            
            mediaRecorder.start();

            // Atualiza UI
            btnStartRecord.classList.add('hidden');
            btnStopRecord.classList.remove('hidden');
            recordingIndicator.style.display = 'flex';
            statusText.textContent = 'Câmera Ativa (Gravando...)';
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                
                // Atualiza UI
                btnStartRecord.classList.remove('hidden');
                btnStopRecord.classList.add('hidden');
                recordingIndicator.style.display = 'none';
                statusText.textContent = 'Câmera Ativa';
            }
        }

        function saveRecording() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = new Date().toLocaleString('pt-BR').replace(/[\/:]/g, '-');
            const filename = `Gravacao_DVR_${timestamp}.webm`;

            // Mostra o container da galeria
            galleryContainer.classList.remove('hidden');

            // Cria um card para o vídeo gravado
            const card = document.createElement('div');
            card.className = 'bg-slate-800 p-3 rounded-lg border border-slate-700 flex flex-col gap-2';
            
            const videoPreview = document.createElement('video');
            videoPreview.src = url;
            videoPreview.controls = true;
            videoPreview.className = 'w-full rounded bg-black mb-2 max-h-48 object-cover';
            
            const title = document.createElement('span');
            title.className = 'text-sm text-slate-300 truncate';
            title.textContent = filename;

            const downloadBtn = document.createElement('a');
            downloadBtn.href = url;
            downloadBtn.download = filename;
            downloadBtn.className = 'bg-green-600 hover:bg-green-700 text-white text-center py-1.5 rounded transition-colors text-sm font-semibold flex items-center justify-center gap-2';
            downloadBtn.innerHTML = '<i class="fa-solid fa-download"></i> Baixar Vídeo';

            card.appendChild(videoPreview);
            card.appendChild(title);
            card.appendChild(downloadBtn);

            // Adiciona no topo da lista
            recordingsList.prepend(card);
        }

        async function togglePip() {
            try {
                if (videoElement !== document.pictureInPictureElement) {
                    await videoElement.requestPictureInPicture();
                } else {
                    await document.exitPictureInPicture();
                }
            } catch (error) {
                console.error("Erro no Picture-in-Picture:", error);
            }
        }

        // Adicionando os eventos aos botões
        btnStartCamera.addEventListener('click', startCamera);
        btnStopCamera.addEventListener('click', stopCamera);
        btnStartRecord.addEventListener('click', startRecording);
        btnStopRecord.addEventListener('click', stopRecording);
        btnPip.addEventListener('click', togglePip);

        // Garante que a câmera seja desligada se o usuário fechar a aba
        window.addEventListener('beforeunload', stopCamera);

    </script>
</body>
</html>
